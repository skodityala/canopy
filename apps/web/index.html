<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Canopy — schoolyard shade plans from satellite imagery</title>
    <meta
      name="description"
      content="Measure a schoolyard's tree canopy and surface temperature from satellite imagery, then generate a costed planting plan with a predicted temperature drop."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      /* Only the reset and the font stacks live here. Everything else comes
         from design/tokens.ts, so there is one source of truth for the look. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: #12100f;
        color: #f2ede9;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Visible focus ring for the keyboard path. §7.2 */
      :focus-visible {
        outline: 2px solid #4ba36a;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
