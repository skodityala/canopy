<text x="54" y="560.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7.5" fill="#a89f99">One or more line items lack a resolvable source, so no headline cost is printed.</text>
<text x="44" y="587.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="8.5" fill="#7d746e" font-weight="600">LIMITATIONS</text>
<line x1="44" y1="593.5" x2="551" y2="593.5" stroke="#332e2b" stroke-width="0.75"/>
<circle cx="46" cy="607" r="1.4" fill="#7d746e"/>
<text x="53" y="609.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">Thermal pixels are 100 m native (resampled to 30 m in the delivered product); this yard is covered by 3 valid thermal pixel(s), so</text>
<text x="53" y="618" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">surface temperature is a yard-scale average and never a per-tree figure.</text>
<circle cx="46" cy="626.5" r="1.4" fill="#7d746e"/>
<text x="53" y="629" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">Single-date imagery: one cloud-free scene is one weather day, not a climate. Landsat overpass was 10:42 local — peak afternoon yard</text>
<text x="53" y="637.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">temperature is higher.</text>
<circle cx="46" cy="646" r="1.4" fill="#7d746e"/>
<text x="53" y="648.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">Canopy is classified by an NDVI threshold, which can catch irrigated turf as well as tree crowns. The threshold is hand-validated per</text>
<text x="53" y="657" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">site and stated above.</text>
<circle cx="46" cy="665.5" r="1.4" fill="#7d746e"/>
<text x="53" y="668" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">Predicted ΔT is an extrapolation from a correlational fit on this scene, not a physical simulation. It is reported as an interval and</text>
<text x="53" y="676.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">phrased as an association.</text>
<circle cx="46" cy="685" r="1.4" fill="#7d746e"/>
<text x="53" y="687.5" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">Crown radii are projections at the stated maturity horizon; a newly planted tree does not shade at its mature radius on planting day.</text>
<line x1="44" y1="702.5" x2="551" y2="702.5" stroke="#332e2b" stroke-width="0.5"/>
<text x="44" y="712.5" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="6.5" fill="#7d746e" style="font-variant-numeric:tabular-nums">NDVI = (NIR − RED)/(NIR + RED)        L_λ = M_L·Q_cal + A_L</text>
<text x="44" y="720.5" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="6.5" fill="#7d746e" style="font-variant-numeric:tabular-nums">BT = K₂/ln(K₁/L_λ + 1)                P_v = ((NDVI−0.2)/0.3)²</text>
<text x="44" y="728.5" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="6.5" fill="#7d746e" style="font-variant-numeric:tabular-nums">ε = 0.004·P_v + 0.986                 LST = BT/(1 + (λ·BT/ρ)·ln ε)</text>
<text x="44" y="736.5" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="6.5" fill="#7d746e" style="font-variant-numeric:tabular-nums">ΔT = β₁ · ΔNDVI_yard                  β₁ from local OLS fit</text>
<text x="297.5" y="826" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e" text-anchor="middle">SYNTH_S2_CACTUS_WREN · SYNTH_LC09_CACTUS_WREN · full method in docs/METHOD.md</text>
</svg>
