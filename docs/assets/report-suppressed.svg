<text x="54" y="545.25" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7.5" fill="#a89f99">One or more line items lack a resolvable source, so no headline cost is printed.</text>
<text x="44" y="572.25" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="8.5" fill="#7d746e" font-weight="600">LIMITATIONS</text>
<line x1="44" y1="578.25" x2="551" y2="578.25" stroke="#332e2b" stroke-width="0.75"/>
<circle cx="46" cy="591.75" r="1.4" fill="#7d746e"/>
<text x="53" y="594.25" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">Thermal pixels are 100 m native (resampled to 30 m in the delivered product); this yard is covered by 1 valid thermal pixel(s), so</text>
<text x="53" y="602.75" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">surface temperature is a yard-scale average and never a per-tree figure.</text>
<circle cx="46" cy="611.25" r="1.4" fill="#7d746e"/>
<text x="53" y="613.75" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">Single-date imagery: one cloud-free scene is one weather day, not a climate. Landsat overpass was 10:42 local — peak afternoon yard</text>
<text x="53" y="622.25" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">temperature is higher.</text>
<circle cx="46" cy="630.75" r="1.4" fill="#7d746e"/>
<text x="53" y="633.25" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">Canopy is classified by an NDVI threshold, which can catch irrigated turf as well as tree crowns. The threshold is hand-validated per</text>
<text x="53" y="641.75" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">site and stated above.</text>
<circle cx="46" cy="650.25" r="1.4" fill="#7d746e"/>
<text x="53" y="652.75" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">Predicted ΔT is an extrapolation from a correlational fit on this scene, not a physical simulation. It is reported as an interval and</text>
<text x="53" y="661.25" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">phrased as an association.</text>
<circle cx="46" cy="669.75" r="1.4" fill="#7d746e"/>
<text x="53" y="672.25" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">Crown radii are projections at the stated maturity horizon; a newly planted tree does not shade at its mature radius on planting day.</text>
<circle cx="46" cy="680.75" r="1.4" fill="#7d746e"/>
<text x="53" y="683.25" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#a89f99">50.0% of this yard's thermal pixels were masked as cloud, cirrus, shadow or fill.</text>
<line x1="44" y1="698.25" x2="551" y2="698.25" stroke="#332e2b" stroke-width="0.5"/>
<text x="44" y="708.25" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="6.5" fill="#7d746e" style="font-variant-numeric:tabular-nums">NDVI = (NIR − RED)/(NIR + RED)        L_λ = M_L·Q_cal + A_L</text>
<text x="44" y="716.25" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="6.5" fill="#7d746e" style="font-variant-numeric:tabular-nums">BT = K₂/ln(K₁/L_λ + 1)                P_v = ((NDVI−0.2)/0.3)²</text>
<text x="44" y="724.25" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="6.5" fill="#7d746e" style="font-variant-numeric:tabular-nums">ε = 0.004·P_v + 0.986                 LST = BT/(1 + (λ·BT/ρ)·ln ε)</text>
<text x="44" y="732.25" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="6.5" fill="#7d746e" style="font-variant-numeric:tabular-nums">ΔT = β₁ · ΔNDVI_yard                  β₁ from local OLS fit</text>
<text x="297.5" y="826" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e" text-anchor="middle">SYNTH_S2_DOS_RIOS · SYNTH_LC09_DOS_RIOS · full method in docs/METHOD.md</text>
</svg>
