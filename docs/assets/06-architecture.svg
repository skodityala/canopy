<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-label="Canopy planting report">
<rect width="1100" height="780" fill="#12100f"/>
<text x="36" y="42" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#f2ede9" font-weight="600">PIPELINE — AND THE THREE PLACES IT REFUSES</text>
<text x="36" y="60" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="8" fill="#a89f99">Amber diamonds are gates. Every one of them can stop a number from being printed.</text>
<rect x="36" y="80" width="196" height="176" fill="#171412" stroke="#332e2b" stroke-width="1"/>
<text x="46" y="94" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="7" fill="#7d746e" font-weight="600" style="font-variant-numeric:tabular-nums">fixtures/schools/&lt;slug&gt;</text>
<rect x="46" y="100" width="176" height="42" fill="#1c1917" stroke="#332e2b" stroke-width="1"/>
<text x="56" y="117" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="8.5" fill="#f2ede9" font-weight="600" style="font-variant-numeric:tabular-nums">Sentinel-2 B4/B8</text>
<text x="56" y="131" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">red + NIR reflectance, 10 m</text>
<rect x="46" y="150" width="176" height="42" fill="#1c1917" stroke="#332e2b" stroke-width="1"/>
<text x="56" y="167" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="8.5" fill="#f2ede9" font-weight="600" style="font-variant-numeric:tabular-nums">Landsat 8/9 B10</text>
<text x="56" y="181" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">thermal digital numbers, 100 m</text>
<rect x="46" y="200" width="176" height="42" fill="#1c1917" stroke="#332e2b" stroke-width="1"/>
<text x="56" y="217" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="8.5" fill="#f2ede9" font-weight="600" style="font-variant-numeric:tabular-nums">Landsat QA_PIXEL</text>
<text x="56" y="231" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">cloud / cirrus / shadow bits</text>
<text x="46" y="268" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">committed JSON · no network at runtime</text>
<rect x="278" y="80" width="196" height="250" fill="#171412" stroke="#332e2b" stroke-width="1"/>
<text x="288" y="94" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="7" fill="#7d746e" font-weight="600" style="font-variant-numeric:tabular-nums">packages/core/src/raster/</text>
<rect x="288" y="100" width="176" height="46" fill="#1c1917" stroke="#332e2b" stroke-width="1"/>
<text x="298" y="117" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="8.5" fill="#f2ede9" font-weight="600" style="font-variant-numeric:tabular-nums">ndvi.ts</text>
<text x="298" y="131" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">(NIR − Red)/(NIR + Red)</text>
<text x="298" y="140" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">null on zero-signal pixel, never 0</text>
<rect x="288" y="154" width="176" height="54" fill="#1c1917" stroke="#332e2b" stroke-width="1"/>
<text x="298" y="171" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="8.5" fill="#f2ede9" font-weight="600" style="font-variant-numeric:tabular-nums">lst.ts</text>
<text x="298" y="185" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">DN → radiance → brightness temp</text>
<text x="298" y="194" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">→ emissivity (Sobrino) → °C</text>
<text x="298" y="203" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">Kelvin throughout; °C once, at the end</text>
<rect x="288" y="216" width="176" height="42" fill="#1c1917" stroke="#332e2b" stroke-width="1"/>
<text x="298" y="233" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="8.5" fill="#f2ede9" font-weight="600" style="font-variant-numeric:tabular-nums">mask.ts</text>
<text x="298" y="247" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">QA bits → cloud mask</text>
<text x="298" y="256" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">yard coverage ratio</text>
<rect x="288" y="266" width="176" height="42" fill="#1c1917" stroke="#332e2b" stroke-width="1"/>
<text x="298" y="283" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="8.5" fill="#f2ede9" font-weight="600" style="font-variant-numeric:tabular-nums">resample.ts</text>
<text x="298" y="297" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">area-weighted 10 m → 100 m</text>
<text x="298" y="306" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">not nearest-neighbour</text>
<line x1="232" y1="168" x2="278" y2="168" stroke="#a89f99" stroke-width="1.2"/>
<path d="M278.0,168.0 L272.0,170.5 L272.0,165.5 Z" fill="#a89f99"/>
<path d="M376,332 L484,372 L376,412 L268,372 Z" fill="#241a0c" stroke="#d99a2b" stroke-width="2"/>
<text x="376" y="375" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="8" fill="#d99a2b" font-weight="600" text-anchor="middle">coverage ≥ 80% ?</text>
<line x1="376" y1="330" x2="376" y2="332" stroke="#a89f99" stroke-width="1.2"/>
<path d="M376.0,332.0 L373.5,326.0 L378.5,326.0 Z" fill="#a89f99"/>
<rect x="36" y="338" width="188" height="68" fill="#241a0c" stroke="#d99a2b" stroke-width="1.5"/>
<text x="46" y="354" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="8" fill="#d99a2b" font-weight="600" style="font-variant-numeric:tabular-nums">SUPPRESSED</text>
<text x="46" y="367" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#a89f99">insufficient_coverage — no temperature is</text>
<text x="46" y="376" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#a89f99">reported for this yard.</text>
<line x1="268" y1="372" x2="224" y2="372" stroke="#d99a2b" stroke-width="1.2"/>
<path d="M224.0,372.0 L230.0,369.5 L230.0,374.5 Z" fill="#d99a2b"/>
<text x="251" y="368" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#d99a2b" font-weight="600">NO</text>
<rect x="520" y="80" width="196" height="250" fill="#171412" stroke="#332e2b" stroke-width="1"/>
<text x="530" y="94" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="7" fill="#7d746e" font-weight="600" style="font-variant-numeric:tabular-nums">packages/core/src/model/</text>
<rect x="530" y="100" width="176" height="54" fill="#1c1917" stroke="#4ba36a" stroke-width="1"/>
<text x="540" y="117" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="8.5" fill="#f2ede9" font-weight="600" style="font-variant-numeric:tabular-nums">regression.ts</text>
<text x="540" y="131" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">OLS: LST ~ NDVI on this scene</text>
<text x="540" y="140" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">β₁, R², n, 95% CI</text>
<text x="540" y="149" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">real Student-t quantile</text>
<rect x="530" y="162" width="176" height="46" fill="#1c1917" stroke="#332e2b" stroke-width="1"/>
<text x="540" y="179" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="8.5" fill="#f2ede9" font-weight="600" style="font-variant-numeric:tabular-nums">canopy.ts</text>
<text x="540" y="193" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">crown union, 0.5 m quadrature</text>
<text x="540" y="202" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">overlap measured, not assumed</text>
<rect x="530" y="216" width="176" height="46" fill="#1c1917" stroke="#332e2b" stroke-width="1"/>
<text x="540" y="233" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="8.5" fill="#f2ede9" font-weight="600" style="font-variant-numeric:tabular-nums">prediction.ts</text>
<text x="540" y="247" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">ΔLST ≈ β₁ · ΔNDVI_yard</text>
<text x="540" y="256" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">CI scaled through</text>
<rect x="530" y="270" width="176" height="38" fill="#1c1917" stroke="#332e2b" stroke-width="1"/>
<text x="540" y="287" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="8.5" fill="#f2ede9" font-weight="600" style="font-variant-numeric:tabular-nums">cost.ts</text>
<text x="540" y="301" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">itemised · citation required per line</text>
<line x1="474" y1="168" x2="520" y2="168" stroke="#a89f99" stroke-width="1.2"/>
<path d="M520.0,168.0 L514.0,170.5 L514.0,165.5 Z" fill="#a89f99"/>
<path d="M618,332 L730,372 L618,412 L506,372 Z" fill="#241a0c" stroke="#d99a2b" stroke-width="2"/>
<text x="618" y="375" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="8" fill="#d99a2b" font-weight="600" text-anchor="middle">R² threshold ?</text>
<line x1="618" y1="330" x2="618" y2="332" stroke="#a89f99" stroke-width="1.2"/>
<path d="M618.0,332.0 L615.5,326.0 L620.5,326.0 Z" fill="#a89f99"/>
<text x="530" y="434" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="7" fill="#7d746e" style="font-variant-numeric:tabular-nums">R² ≥ 0.50</text>
<text x="598" y="434" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7.5" fill="#4ba36a" font-weight="600">▶  ESTIMATE</text>
<text x="530" y="449" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="7" fill="#7d746e" style="font-variant-numeric:tabular-nums">R² ≥ 0.30</text>
<text x="598" y="449" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7.5" fill="#d99a2b" font-weight="600">▶  INDICATIVE</text>
<text x="530" y="464" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="7" fill="#7d746e" style="font-variant-numeric:tabular-nums">R² &lt; 0.30</text>
<text x="598" y="464" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7.5" fill="#d99a2b" font-weight="600">▶  SUPPRESSED</text>
<line x1="618" y1="412" x2="618" y2="424" stroke="#d99a2b" stroke-width="1.2"/>
<path d="M618.0,424.0 L615.5,418.0 L620.5,418.0 Z" fill="#d99a2b"/>
<path d="M376,482 L488,522 L376,562 L264,522 Z" fill="#241a0c" stroke="#d99a2b" stroke-width="2"/>
<text x="376" y="525" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="8" fill="#d99a2b" font-weight="600" text-anchor="middle">every line cited ?</text>
<rect x="36" y="488" width="188" height="68" fill="#241a0c" stroke="#d99a2b" stroke-width="1.5"/>
<text x="46" y="504" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="8" fill="#d99a2b" font-weight="600" style="font-variant-numeric:tabular-nums">UNSOURCED</text>
<text x="46" y="517" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#a89f99">That line is excluded and the headline total is</text>
<text x="46" y="526" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#a89f99">withheld entirely.</text>
<line x1="264" y1="522" x2="224" y2="522" stroke="#d99a2b" stroke-width="1.2"/>
<path d="M224.0,522.0 L230.0,519.5 L230.0,524.5 Z" fill="#d99a2b"/>
<text x="249" y="518" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#d99a2b" font-weight="600">NO</text>
<line x1="618" y1="490" x2="488" y2="510" stroke="#a89f99" stroke-width="1.2"/>
<path d="M488.0,510.0 L493.5,506.6 L494.3,511.6 Z" fill="#a89f99"/>
<rect x="278" y="596" width="438" height="54" fill="#1c1917" stroke="#4ba36a" stroke-width="1"/>
<text x="288" y="613" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="8.5" fill="#f2ede9" font-weight="600" style="font-variant-numeric:tabular-nums">report/buildReport.ts  →  packages/render</text>
<text x="288" y="627" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">One renderer, two backends: the PDF a facilities office receives and the SVG in this README</text>
<text x="288" y="636" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">are the same code — so the documentation cannot drift from the artifact.</text>
<line x1="376" y1="562" x2="376" y2="596" stroke="#a89f99" stroke-width="1.2"/>
<path d="M376.0,596.0 L373.5,590.0 L378.5,590.0 Z" fill="#a89f99"/>
<rect x="36" y="620" width="188" height="118" fill="#1c1917" stroke="#4ba36a" stroke-width="1"/>
<text x="46" y="638" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#4ba36a" font-weight="600">THE DEPENDENCY RULE</text>
<text x="46" y="654" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#a89f99">packages/core imports nothing. Zero I/O, zero</text>
<text x="46" y="663" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#a89f99">DOM, zero network — enforced by an empty `types`</text>
<text x="46" y="672" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#a89f99">array in its tsconfig and by a test that greps</text>
<text x="46" y="681" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#a89f99">the source. Importing node:fs there is a compile</text>
<text x="46" y="690" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#a89f99">error.</text>
<text x="278" y="638" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="7" fill="#7d746e" font-weight="600">PORT BOUNDARY</text>
<text x="278" y="656" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="7.5" fill="#f2ede9" font-weight="600" style="font-variant-numeric:tabular-nums">ImageryPort</text>
<text x="286" y="666" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">fixture adapter (default, offline) · real COG scenes drop in unchanged</text>
<text x="278" y="679" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="7.5" fill="#f2ede9" font-weight="600" style="font-variant-numeric:tabular-nums">CostModelPort</text>
<text x="286" y="689" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">cited regional JSON — data, not a service</text>
<text x="278" y="702" font-family="'IBM Plex Mono','SF Mono',Menlo,ui-monospace,monospace" font-size="7.5" fill="#f2ede9" font-weight="600" style="font-variant-numeric:tabular-nums">BasemapPort</text>
<text x="286" y="712" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" fill="#7d746e">bundled offline tiles</text>
</svg>
